{% extends "base.html" %}
{% block title %}{{ action }} Ministry{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h1>{{ action }} Ministry</h1>
      <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="card">
          <div class="card-body">
            {% for field in form %}
              <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                  <div class="invalid-feedback d-block">
                    {{ field.errors }}
                  </div>
                {% endif %}
              </div>
            {% endfor %}
          </div>
          <div class="card-footer d-flex gap-2">
            <button type="submit" class="btn btn-primary">{{ action }}</button>
            <a href="{% url 'ministries' %}" class="btn btn-secondary">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
