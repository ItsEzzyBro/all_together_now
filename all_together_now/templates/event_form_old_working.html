{% extends "base.html" %}
{% block title %}{{ action }} Event{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3>{{ action }} Event</h3>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
          <label for="event_name" class="form-label">Event Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="event_name" name="event_name" required>
        </div>

        <div class="mb-3">
          <label for="event_description" class="form-label">Description</label>
          <textarea class="form-control" id="event_description" name="event_description" rows="4"></textarea>
        </div>

        <div class="mb-3">
          <label for="ministry" class="form-label">Ministry</label>
          <select class="form-select" id="ministry" name="ministry">
            <option value="">No ministry</option>
            {% for ministry in ministries %}
              <option value="{{ ministry.pk }}" {% if preselected_ministry|stringformat:"s" == ministry.pk|stringformat:"s" %}selected{% endif %}>{{ ministry.ministry_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="is_active" name="is_active" checked>
            <label class="form-check-label" for="is_active">
              Active
            </label>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">{{ action }} Event</button>
          <a href="{% url 'events' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
