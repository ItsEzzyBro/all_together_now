{% extends "base.html" %}
{% block title %}Create Event{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1>Create Event for {{ ministry.ministry_name }}</h1>
  <div class="alert alert-info">This is a placeholder event creation page. Implement event models and handling when ready.</div>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Event Name</label>
      <input class="form-control" name="name" />
    </div>
    <div class="mb-3">
      <label class="form-label">Date</label>
      <input class="form-control" type="date" name="date" />
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Create</button>
      <a href="{% url 'ministries' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
